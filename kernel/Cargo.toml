[package]
name = "AnvilOs"
version = "0.1.1"
edition = "2024"

[package.metadata.kernel]
version_major = 0
version_minor = 1
version_patch = 0
version_suffix = "-alpha"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
limine = "0.5"
volatile = "0.6.1"
spin = "0.12.0"
paste = "1.0"
bitflags = "2.13.0"
elf = { version = "0.8.0", default-features = false }
bitfield-struct = "0.13.0"
atomic_enum = { version = "0.3", features = ["cas"] }
bit_field = "0.10.3"
intrusive-collections = "0.10.2"
slabmalloc = "0.11.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = "6.1.1"
uart_16550 = "0.4.0"
x86_64 = "0.15.4"
raw-cpuid = "11.6.0"

[target.'cfg(target_arch = "riscv64")'.dependencies]
fdt = "0.1.5"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[build-dependencies]
cc = "1.2.64"

[[bin]]
name = "limine-rust-template"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["pmm_tests", "vmm_tests"]
pmm_tests = []
vmm_tests = []
